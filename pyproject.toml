[project]
name = "docscrub"
version = "0.1.0"
description = "A lightweight Python library to clean raw text and documents before NLP and LLM workflows."
authors = [
    {name = "Saim Chaudhary"}
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

dependencies = [
    "ftfy>=6.3.1",
]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "build>=1.5.0",
    "twine>=7.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"