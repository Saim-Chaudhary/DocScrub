name: Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Install uv
        uses: astral-sh/setup-uv@v5


      - name: Install Python
        run: uv python install ${{ matrix.python-version }}


      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}


      - name: Install DocScrub package
        run: uv pip install -e .


      - name: Run tests
        run: uv run pytest


      - name: Run linting
        run: uv run ruff check .